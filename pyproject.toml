[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "flatppl"
version = "0.1.0"
description = "FlatPPL modules compiled to differentiable JAX functions through StableHLO"
requires-python = ">=3.12,<3.16"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "numpy>=2",
    "pyarrow>=25",
    # Unsupported targets must still require the fork.
    'enzyme-ad==0.0.15+flatppl.23 ; (sys_platform != "darwin" or platform_machine != "arm64") and (sys_platform != "linux" or (platform_machine != "x86_64" and platform_machine != "aarch64"))',
    # The wheels below also reverse while loops with data-dependent trip counts,
    # keep Boolean-to-integer comparisons under AD and differentiate the
    # compiler's eigh helper analytically.
    'enzyme-ad @ https://github.com/nsiccha/Enzyme-JAX/releases/download/flatppl-alpha.23-adaptivewhile.boolrange.eigh.1/enzyme_ad-0.0.15%2Bflatppl.23.adaptivewhile.boolrange.eigh.1-cp312-cp312-macosx_14_0_arm64.whl#sha256=4ca41892912de005cb5de71fbf3e17fe3f4715c4a98a0ab33a274de5ea48de3b ; python_version == "3.12" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/nsiccha/Enzyme-JAX/releases/download/flatppl-alpha.23-adaptivewhile.boolrange.eigh.1/enzyme_ad-0.0.15%2Bflatppl.23.adaptivewhile.boolrange.eigh.1-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=d39081cc81291455f0b0fdef91b5360813c4ca7f6eb9a9f620750ef4486f07bc ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/nsiccha/Enzyme-JAX/releases/download/flatppl-alpha.23-adaptivewhile.boolrange.eigh.1/enzyme_ad-0.0.15%2Bflatppl.23.adaptivewhile.boolrange.eigh.1-cp313-cp313-macosx_14_0_arm64.whl#sha256=679898821a30db59ea064c2fca6a20e9e6ca2bc680baaf68057b7ceebc8c09a9 ; python_version == "3.13" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/nsiccha/Enzyme-JAX/releases/download/flatppl-alpha.23-adaptivewhile.boolrange.eigh.1/enzyme_ad-0.0.15%2Bflatppl.23.adaptivewhile.boolrange.eigh.1-cp313-cp313-manylinux_2_28_x86_64.whl#sha256=0a727398debbd127c5d552edb2fb8a48b9b549554ce0807e59fff69495559008 ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/nsiccha/Enzyme-JAX/releases/download/flatppl-alpha.23-adaptivewhile.boolrange.eigh.1/enzyme_ad-0.0.15%2Bflatppl.23.adaptivewhile.boolrange.eigh.1-cp314-cp314-macosx_14_0_arm64.whl#sha256=5cf1f7400b9e4db070f0983c3785ad1d8fb8cde1ade3ea518e5e7ebd8a14b372 ; python_version == "3.14" and sys_platform == "darwin" and platform_machine == "arm64"',
    # This target's wheel also accepts Enzyme's dialect in imported modules,
    # including batched forward derivatives through `reverse`.
    'enzyme-ad @ https://github.com/nsiccha/Enzyme-JAX/releases/download/flatppl-alpha.23-adaptivewhile.boolrange.eigh.enzymedialect.batchedreverse.1/enzyme_ad-0.0.15%2Bflatppl.23.adaptivewhile.boolrange.eigh.enzymedialect.batchedreverse.1-cp314-cp314-manylinux_2_28_x86_64.whl#sha256=18d77788ef4bd611aecf85c1b041de70aaa18c0a40943e775bc721c18ff9ca4b ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/nsiccha/Enzyme-JAX/releases/download/flatppl-alpha.23-adaptivewhile.boolrange.eigh.1/enzyme_ad-0.0.15%2Bflatppl.23.adaptivewhile.boolrange.eigh.1-cp315-cp315-macosx_14_0_arm64.whl#sha256=a4f4c7744647d2a50f5aa105ef9cbe6346997649c9c39014a941b0e1e374be65 ; python_version == "3.15" and sys_platform == "darwin" and platform_machine == "arm64"',
    'enzyme-ad @ https://github.com/nsiccha/Enzyme-JAX/releases/download/flatppl-alpha.23-adaptivewhile.boolrange.eigh.1/enzyme_ad-0.0.15%2Bflatppl.23.adaptivewhile.boolrange.eigh.1-cp315-cp315-manylinux_2_28_x86_64.whl#sha256=5f67e9fdd392d0ac98035de5058df279254683f4229cd3ec61b33e09012a1df4 ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "x86_64"',
    'enzyme-ad @ https://github.com/nsiccha/Enzyme-JAX/releases/download/flatppl-alpha.23-adaptivewhile.boolrange.eigh.1/enzyme_ad-0.0.15%2Bflatppl.23.adaptivewhile.boolrange.eigh.1-cp312-cp312-manylinux_2_28_aarch64.whl#sha256=2538167f92d3f41d5f53bf8ab7814e4e0d8ef9b953b0bebb3fe6c87c6c0fecec ; python_version == "3.12" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/nsiccha/Enzyme-JAX/releases/download/flatppl-alpha.23-adaptivewhile.boolrange.eigh.1/enzyme_ad-0.0.15%2Bflatppl.23.adaptivewhile.boolrange.eigh.1-cp313-cp313-manylinux_2_28_aarch64.whl#sha256=e6696217c52ac30596e4a19b72120c8fc2b1e6cfe4512b6e8a9cd854c18f3c0d ; python_version == "3.13" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/nsiccha/Enzyme-JAX/releases/download/flatppl-alpha.23-adaptivewhile.boolrange.eigh.1/enzyme_ad-0.0.15%2Bflatppl.23.adaptivewhile.boolrange.eigh.1-cp314-cp314-manylinux_2_28_aarch64.whl#sha256=e8d41420c2f5f556f630fb33a829206a4d9626aa31c7f959cfe99a796929df84 ; python_version == "3.14" and sys_platform == "linux" and platform_machine == "aarch64"',
    'enzyme-ad @ https://github.com/nsiccha/Enzyme-JAX/releases/download/flatppl-alpha.23-adaptivewhile.boolrange.eigh.1/enzyme_ad-0.0.15%2Bflatppl.23.adaptivewhile.boolrange.eigh.1-cp315-cp315-manylinux_2_28_aarch64.whl#sha256=327402fcb6af97d9aab0d8f62eb2a28ec001ba2b5a9b2ff52ec0a1aae0f8603c ; python_version == "3.15" and sys_platform == "linux" and platform_machine == "aarch64"',
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Documentation = "https://flatppl.org/flatppl-python/"
Repository = "https://github.com/flatppl/flatppl-python"

[project.optional-dependencies]
test = ["pytest>=8", "blackjax==1.7.1", "pandas==3.1.0", "polars>=2", "pyhf==0.7.6", "networkx>=3"]

[dependency-groups]
lint = ["ruff>=0.16", "pyright>=1.1.414", "pandas-stubs>=3"]

[tool.maturin]
features = ["extension"]
python-source = "python"
module-name = "flatppl._native"
exclude = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests", "examples"]
extraPaths = ["python"]
# Stubs declare the untyped imports as Any: enzyme_ad, blackjax, pyhf, pyarrow,
# networkx, and the gallery's optax, numpyro, arviz, iminuit, nutpie, uproot
# and scipy.
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.12"
# JAX 0.12.0.1 types jit, grad, value_and_grad and jvp with a bare Callable, and
# jaxlib 0.12.0.1 ships _jax.so without a stub, so Device in jnp.array is Unknown
# to pyright 1.1.414. Tests and examples call these throughout, so only there
# reportUnknownMemberType, reportUnknownArgumentType, reportUnknownVariableType
# and reportUnknownLambdaType are off. The package marks its JAX call sites.
# Retry the full rule set after each JAX bump.
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "examples", reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false },
    { root = "python" },
]

[tool.ruff]
target-version = "py312"
src = ["python"]
# Code in the Markdown guides is formatted for reading, not by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "RUF"]
# The formatter owns line length. Long lines left are FlatPPL source in strings.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# These closures run inside the loop iteration that binds their variables.
"tests/**" = ["D", "B023"]
"examples/corpus.py" = ["B023"]
# Gallery pages start with a reStructuredText title.
"examples/**" = ["D205", "D415"]
